services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: nagar_suraksha
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data", "./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/nagar_suraksha
      ADMIN_KEY: change-me
    ports: ["8000:8000"]
    depends_on: [db]
volumes:
  pgdata:
